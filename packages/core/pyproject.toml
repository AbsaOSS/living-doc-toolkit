[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-doc-core"
version = "1.0.0"
description = "Core utilities for the Living Documentation Toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "AbsaOSS", email = "miroslav.pojer@absa.africa"}
]
requires-python = ">=3.10"
dependencies = [
    "living-doc-utilities==0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "pylint>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "deptry>=0.25.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py310']
extend-exclude = '''
^(
    tests/
)
'''

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = '^(tests/|build/)'

# `deptry .` from this directory: the [dev] extra holds only tools, which no module imports; `src/` is this package.
[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
known_first_party = ["living_doc_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term --cov-report=html --cov-fail-under=80"
