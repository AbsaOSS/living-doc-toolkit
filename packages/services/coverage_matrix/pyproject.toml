[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-doc-service-coverage-matrix"
version = "1.0.0"
description = "Coverage matrix generator for the Living Documentation Toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "AbsaOSS", email = "opensource@absa.africa"}
]
requires-python = ">=3.14"
dependencies = [
    "living-doc-core",
    "jsonschema>=4.20.0,<5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "pylint>=3.0.0",
    "mypy>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"living_doc_service_coverage_matrix" = ["schema/*.json"]

[tool.black]
line-length = 120
target-version = ['py314']
extend-exclude = '''
^(
    tests/
    | verifications/
)
'''

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
python_version = "3.14"
exclude = '^(tests/|verifications/)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term --cov-report=html --cov-fail-under=80"
