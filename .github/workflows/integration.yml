name: Integration Tests
on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No command runs yet: every run of the action builds or reuses its venv, checks its inputs and fails on the
# "not available yet" line, so each run step continues on error and the job asserts the failure. A step cannot read
# another step's log, so each job replays the run's inputs on the action's venv and asserts that line there.
jobs:
  action-venv-isolation:
    runs-on: ubuntu-latest
    name: Action Venv - Isolation and Reuse
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install a conflicting pydantic into the runner's interpreter
        run: |
          set -euo pipefail
          pip install 'pydantic<2'
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/before.txt"

      - name: Run the action (first step)
        id: first
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/first/generator-ready.json

      - name: Stamp the venv
        run: stat -c %Y "${RUNNER_TEMP}/living-doc-toolkit-venv/pyvenv.cfg" > "${RUNNER_TEMP}/venv-cfg-mtime.txt"

      - name: Run the action (second step)
        id: second
        continue-on-error: true
        uses: ./
        with:
          command: coverage-matrix
          input: tests/fixtures/collector-gh/doc-source.json
          tests-input: tests/fixtures/collector-gh/ui-tests.json
          output: output/second/coverage-matrix.json

      - name: Run the action (third step)
        id: third
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/third/generator-ready.json
          view: release
          document-title: Checkout tests

      - name: Every step stopped on "not available yet", the venv was reused, the caller's environment is unchanged
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTCOMES: ${{ steps.first.outcome }} ${{ steps.second.outcome }} ${{ steps.third.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOMES" != "failure failure failure" ]]; then
            echo "::error::every run of the action must fail while no command runs; the outcomes: $OUTCOMES."; exit 1
          fi
          test "$(stat -c %Y "$VENV/pyvenv.cfg")" = "$(cat "${RUNNER_TEMP}/venv-cfg-mtime.txt")"
          out="${RUNNER_TEMP}/replay"
          replay() {
            local command="$1" status=0
            shift
            env "$@" INPUT_COMMAND="$command" GITHUB_OUTPUT="$out.output" \
              "$VENV/bin/python" -E main.py > "$out.log" 2>&1 || status=$?
            cat "$out.log"
            test "$status" = 1
            grep -Fx "[ERROR] Command \`$command\` is not available yet; no command runs yet." "$out.log"
            test ! -e "$out.output"
          }
          replay normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT="$out/first/generator-ready.json"
          replay coverage-matrix INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_TESTS_INPUT=tests/fixtures/collector-gh/ui-tests.json INPUT_OUTPUT="$out/second/coverage-matrix.json"
          replay normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT="$out/third/generator-ready.json" INPUT_VIEW=release INPUT_DOCUMENT_TITLE='Checkout tests'
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/after.txt"
          diff "${RUNNER_TEMP}/before.txt" "${RUNNER_TEMP}/after.txt"
          echo '::notice::every step stopped on "not available yet", as the replays on the venv did, the venv was reused, and the runner interpreter is unchanged.'

  action-venv-rebuilt-when-python-changes:
    runs-on: ubuntu-latest
    name: Action Venv - Rebuilt When Python Changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run the action on 3.12
        id: on-312
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/on-312/generator-ready.json

      - name: The venv was built from 3.12, and the run stopped on "not available yet"
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTCOME: ${{ steps.on-312.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          "$VENV/bin/python" -c 'import sys, living_doc_cli.main; assert sys.version_info[:2] == (3, 12), sys.version'
          status=0
          INPUT_COMMAND=normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT=output/on-312/generator-ready.json \
            "$VENV/bin/python" -E main.py > "${RUNNER_TEMP}/replay.log" 2>&1 || status=$?
          cat "${RUNNER_TEMP}/replay.log"
          test "$status" = 1
          grep -Fx '[ERROR] Command `normalize-docs` is not available yet; no command runs yet.' "${RUNNER_TEMP}/replay.log"

      - name: Switch the interpreter on PATH to 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run the action on 3.11
        id: on-311
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/on-311/generator-ready.json

      - name: The venv was rebuilt from the interpreter now on PATH, and the run stopped on "not available yet"
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTCOME: ${{ steps.on-311.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          "$VENV/bin/python" -c 'import sys, living_doc_cli.main; assert sys.version_info[:2] == (3, 11), sys.version'
          status=0
          INPUT_COMMAND=normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT=output/on-311/generator-ready.json \
            "$VENV/bin/python" -E main.py > "${RUNNER_TEMP}/replay.log" 2>&1 || status=$?
          cat "${RUNNER_TEMP}/replay.log"
          test "$status" = 1
          grep -Fx '[ERROR] Command `normalize-docs` is not available yet; no command runs yet.' "${RUNNER_TEMP}/replay.log"
          echo '::notice::switching the interpreter rebuilt the venv instead of reusing the 3.12 one.'

  action-rejects-python-39:
    runs-on: ubuntu-latest
    name: Action Venv - Python 3.9 Is Rejected
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'

      - name: Run the action, which must fail
        id: run-on-39
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/on-39/generator-ready.json

      - name: The action failed on the version check, before creating a venv
        env:
          OUTCOME: ${{ steps.run-on-39.outcome }}
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::the action must fail when PATH's Python is older than 3.10."; exit 1
          fi
          if [[ -d "${RUNNER_TEMP}/living-doc-toolkit-venv" ]]; then
            echo "::error::the action must fail the version check before it creates a venv."; exit 1
          fi
