name: Integration Tests
on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `action-run` runs each command the action runs over the fixtures and checks the file it wrote. The venv jobs run the
# action several times on one runner: `normalize-docs` and `coverage-matrix` write their files. Each run step continues
# on error and the job asserts its outcome. A step cannot read another step's log, so each venv job replays the run's
# inputs on the action's venv and asserts the exit code, `output-path` and the file written.
jobs:
  action-run:
    runs-on: ubuntu-latest
    name: Action Run - Each Command Over the Fixtures
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Run normalize-docs
        id: normalize-docs
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/generator-ready.json
          view: release

      - name: normalize-docs wrote a valid generator-ready file in the release view with this run, and output-path names it
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTPUT_PATH: ${{ steps.normalize-docs.outputs.output-path }}
        run: |
          set -euo pipefail
          if [[ "$OUTPUT_PATH" != "$GITHUB_WORKSPACE/output/generator-ready.json" ]]; then
            echo "::error::output-path must be the absolute path of the file written; it is '$OUTPUT_PATH'."; exit 1
          fi
          "$VENV/bin/python" -I -c '
          import sys
          from living_doc_utilities.contracts.generator_ready import GeneratorReadyResult
          from living_doc_utilities.contracts.io import read_artifact
          result = read_artifact(sys.argv[1], expected="generator-ready")
          assert isinstance(result, GeneratorReadyResult), type(result)
          summary = result.document.selection_summary
          assert result.document.view == "release", result.document.view
          assert (summary.total_entities, summary.included_entities, summary.excluded_entities) == (5, 3, 2), summary
          assert (
              summary.total_acceptance_criteria,
              summary.included_acceptance_criteria,
              summary.excluded_acceptance_criteria,
          ) == (7, 6, 1), summary
          assert result.metadata.run.run_id == sys.argv[2], (result.metadata.run, sys.argv[2])
          assert result.metadata.producer.build is None, result.metadata.producer
          print(summary)
          print(result.metadata.run)
          ' "$OUTPUT_PATH" "$GITHUB_RUN_ID"
          echo '::notice::normalize-docs wrote a valid generator-ready file in the release view, with this run, at the output-path.'

      - name: Run normalize-tests
        id: normalize-tests
        uses: ./
        with:
          command: normalize-tests
          input: tests/fixtures/collector-gh/ui-tests.json
          output: output/ui-test-catalog.json

      - name: normalize-tests wrote a valid catalog with this run, and output-path names it
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTPUT_PATH: ${{ steps.normalize-tests.outputs.output-path }}
        run: |
          set -euo pipefail
          if [[ "$OUTPUT_PATH" != "$GITHUB_WORKSPACE/output/ui-test-catalog.json" ]]; then
            echo "::error::output-path must be the absolute path of the file written; it is '$OUTPUT_PATH'."; exit 1
          fi
          "$VENV/bin/python" -I -c '
          import sys
          from living_doc_utilities.contracts.io import read_artifact
          from living_doc_utilities.contracts.ui_test_catalog import UiTestCatalogResult
          result = read_artifact(sys.argv[1], expected="ui-test-catalog")
          assert isinstance(result, UiTestCatalogResult), type(result)
          assert result.document.view == "inner", result.document
          assert [feature_file.feature_file for feature_file in result.feature_files] == [
              "AbsaOSS/living-doc/docs/examples/gherkin/liv_doc_func/func-001-validate-password-strength.feature",
              "AbsaOSS/living-doc/docs/examples/gherkin/liv_doc_us/us-001-customer-login.feature",
          ]
          functionality_file, user_story_file = result.feature_files
          assert [(group.entity_id, len(group.scenarios)) for group in functionality_file.linked_to_functionality] == [("FUNC-001", 4)]
          assert [(group.entity_id, len(group.scenarios)) for group in user_story_file.linked_to_user_story] == [("US-001", 2)]
          assert not any(feature_file.unlinked for feature_file in result.feature_files)
          assert result.metadata.run.run_id == sys.argv[2], (result.metadata.run, sys.argv[2])
          assert result.metadata.producer.build is None, result.metadata.producer
          print(result.document.view)
          print(result.metadata.run)
          ' "$OUTPUT_PATH" "$GITHUB_RUN_ID"
          echo '::notice::normalize-tests wrote a valid ui-test-catalog file with this run at the output-path.'

      - name: Run coverage-matrix
        id: coverage-matrix
        uses: ./
        with:
          command: coverage-matrix
          input: tests/fixtures/collector-gh/doc-source.json
          tests-input: tests/fixtures/collector-gh/ui-tests.json
          output: output/coverage-matrix.json
          view: release

      - name: coverage-matrix wrote a valid matrix in the release view with this run, and output-path names it
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTPUT_PATH: ${{ steps.coverage-matrix.outputs.output-path }}
        run: |
          set -euo pipefail
          if [[ "$OUTPUT_PATH" != "$GITHUB_WORKSPACE/output/coverage-matrix.json" ]]; then
            echo "::error::output-path must be the absolute path of the file written; it is '$OUTPUT_PATH'."; exit 1
          fi
          "$VENV/bin/python" -I -c '
          import sys
          from living_doc_utilities.contracts.coverage_matrix import CoverageMatrixResult
          from living_doc_utilities.contracts.io import read_artifact
          result = read_artifact(sys.argv[1], expected="coverage-matrix")
          assert isinstance(result, CoverageMatrixResult), type(result)
          summary = result.summary
          assert result.document.view == "release", result.document.view
          assert (
              summary.counted_acs,
              summary.covered_acs,
              summary.partially_covered_acs,
              summary.not_covered_acs,
          ) == (6, 3, 1, 2), summary
          assert summary.coverage_pct == 55.6, summary
          row = next(row for entity in result.entities for row in entity.acceptance_criteria if row.ac_id == "FUNC-001-03")
          assert (row.status, row.keyword) == ("partially_covered", "rule"), row
          assert result.metadata.run.run_id == sys.argv[2], (result.metadata.run, sys.argv[2])
          assert result.metadata.producer.build is None, result.metadata.producer
          print(summary)
          print(result.metadata.run)
          ' "$OUTPUT_PATH" "$GITHUB_RUN_ID"
          echo '::notice::coverage-matrix wrote a valid coverage matrix in the release view, with this run, at the output-path.'

  action-venv-isolation:
    runs-on: ubuntu-latest
    name: Action Venv - Isolation and Reuse
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install a conflicting pydantic into the runner's interpreter
        run: |
          set -euo pipefail
          pip install 'pydantic<2'
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/before.txt"

      - name: Run the action (first step)
        id: first
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/first/generator-ready.json

      - name: Stamp the venv
        run: stat -c %Y "${RUNNER_TEMP}/living-doc-toolkit-venv/pyvenv.cfg" > "${RUNNER_TEMP}/venv-cfg-mtime.txt"

      - name: Run the action (second step)
        id: second
        continue-on-error: true
        uses: ./
        with:
          command: coverage-matrix
          input: tests/fixtures/collector-gh/doc-source.json
          tests-input: tests/fixtures/collector-gh/ui-tests.json
          output: output/second/coverage-matrix.json

      - name: Run the action (third step)
        id: third
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/third/generator-ready.json
          view: release
          document-title: Checkout tests

      - name: normalize-docs and coverage-matrix wrote their files, the venv was reused, the caller's environment is unchanged
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTCOMES: ${{ steps.first.outcome }} ${{ steps.second.outcome }} ${{ steps.third.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOMES" != "success success success" ]]; then
            echo "::error::normalize-docs and coverage-matrix must succeed; the outcomes: $OUTCOMES."; exit 1
          fi
          test "$(stat -c %Y "$VENV/pyvenv.cfg")" = "$(cat "${RUNNER_TEMP}/venv-cfg-mtime.txt")"
          # A valid generator-ready file, with the view and title given.
          written() {
            "$VENV/bin/python" -I -c '
          import sys
          from living_doc_utilities.contracts.io import read_artifact
          path, view, title = sys.argv[1:]
          document = read_artifact(path, expected="generator-ready").document
          assert (document.view, document.title) == (view, title), document
          ' "$@"
          }
          # A valid coverage matrix, with the fixture pair's counted criteria.
          matrix() {
            "$VENV/bin/python" -I -c '
          import sys
          from living_doc_utilities.contracts.io import read_artifact
          summary = read_artifact(sys.argv[1], expected="coverage-matrix").summary
          assert (summary.counted_acs, summary.coverage_pct) == (6, 55.6), summary
          ' "$@"
          }
          written output/first/generator-ready.json inner living-doc-examples
          matrix output/second/coverage-matrix.json
          written output/third/generator-ready.json release 'Checkout tests'
          out="${RUNNER_TEMP}/replay"
          replay() {
            local expected="$1" command="$2" status=0
            shift 2
            rm -f "$out.output"
            env "$@" INPUT_COMMAND="$command" GITHUB_OUTPUT="$out.output" \
              "$VENV/bin/python" -E main.py > "$out.log" 2>&1 || status=$?
            cat "$out.log"
            test "$status" = "$expected"
          }
          replay 0 normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT="$out/first/generator-ready.json"
          grep -Fx "output-path=$out/first/generator-ready.json" "$out.output"
          written "$out/first/generator-ready.json" inner living-doc-examples
          replay 0 coverage-matrix INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_TESTS_INPUT=tests/fixtures/collector-gh/ui-tests.json INPUT_OUTPUT="$out/second/coverage-matrix.json"
          grep -Fx "output-path=$out/second/coverage-matrix.json" "$out.output"
          matrix "$out/second/coverage-matrix.json"
          replay 0 normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT="$out/third/generator-ready.json" INPUT_VIEW=release INPUT_DOCUMENT_TITLE='Checkout tests'
          grep -Fx "output-path=$out/third/generator-ready.json" "$out.output"
          written "$out/third/generator-ready.json" release 'Checkout tests'
          {
            which python
            python --version
            python -c 'import pydantic; print(pydantic.VERSION)'
          } | tee "${RUNNER_TEMP}/after.txt"
          diff "${RUNNER_TEMP}/before.txt" "${RUNNER_TEMP}/after.txt"
          echo '::notice::normalize-docs and coverage-matrix wrote their files, as the replays on the venv did, the venv was reused, and the runner interpreter is unchanged.'

  action-venv-rebuilt-when-python-changes:
    runs-on: ubuntu-latest
    name: Action Venv - Rebuilt When Python Changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run the action on 3.12
        id: on-312
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/on-312/generator-ready.json

      - name: The venv was built from 3.12, and normalize-docs wrote its file
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTCOME: ${{ steps.on-312.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = success
          "$VENV/bin/python" -c 'import sys, living_doc_cli.main; assert sys.version_info[:2] == (3, 12), sys.version'
          INPUT_COMMAND=normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT="${RUNNER_TEMP}/replay/generator-ready.json" GITHUB_OUTPUT="${RUNNER_TEMP}/replay.output" \
            "$VENV/bin/python" -E main.py
          # The step's file and the replay's: each a valid generator-ready file.
          "$VENV/bin/python" -I -c 'import sys; from living_doc_utilities.contracts.io import read_artifact; [read_artifact(path, expected="generator-ready") for path in sys.argv[1:]]' \
            output/on-312/generator-ready.json "${RUNNER_TEMP}/replay/generator-ready.json"

      - name: Switch the interpreter on PATH to 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run the action on 3.11
        id: on-311
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/on-311/generator-ready.json

      - name: The venv was rebuilt from the interpreter now on PATH, and normalize-docs wrote its file
        env:
          VENV: ${{ runner.temp }}/living-doc-toolkit-venv
          OUTCOME: ${{ steps.on-311.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = success
          "$VENV/bin/python" -c 'import sys, living_doc_cli.main; assert sys.version_info[:2] == (3, 11), sys.version'
          rm -f "${RUNNER_TEMP}/replay/generator-ready.json"
          INPUT_COMMAND=normalize-docs INPUT_INPUT=tests/fixtures/collector-gh/doc-source.json \
            INPUT_OUTPUT="${RUNNER_TEMP}/replay/generator-ready.json" GITHUB_OUTPUT="${RUNNER_TEMP}/replay.output" \
            "$VENV/bin/python" -E main.py
          "$VENV/bin/python" -I -c 'import sys; from living_doc_utilities.contracts.io import read_artifact; [read_artifact(path, expected="generator-ready") for path in sys.argv[1:]]' \
            output/on-311/generator-ready.json "${RUNNER_TEMP}/replay/generator-ready.json"
          echo '::notice::switching the interpreter rebuilt the venv instead of reusing the 3.12 one.'

  action-rejects-python-39:
    # setup-python publishes no 3.9 for ubuntu-latest (26.04); 24.04 is the newest image that has one.
    runs-on: ubuntu-24.04
    name: Action Venv - Python 3.9 Is Rejected
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Run the action, which must fail
        id: run-on-39
        continue-on-error: true
        uses: ./
        with:
          command: normalize-docs
          input: tests/fixtures/collector-gh/doc-source.json
          output: output/on-39/generator-ready.json

      - name: The action failed on the version check, before creating a venv
        env:
          OUTCOME: ${{ steps.run-on-39.outcome }}
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "::error::the action must fail when PATH's Python is older than 3.10."; exit 1
          fi
          if [[ -d "${RUNNER_TEMP}/living-doc-toolkit-venv" ]]; then
            echo "::error::the action must fail the version check before it creates a venv."; exit 1
          fi
