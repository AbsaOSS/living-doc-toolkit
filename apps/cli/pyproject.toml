[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-doc-cli"
version = "0.1.0"
description = "CLI wrapper for the Living Documentation Toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "AbsaOSS", email = "miroslav.pojer@absa.africa"}
]
requires-python = ">=3.10"
dependencies = [
    "living-doc-core",
    "living-doc-service-normalize-issues",
    "living-doc-service-coverage-matrix",
    "click>=8.1.0,<9.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "pylint>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0"
]

[project.scripts]
living-doc = "living_doc_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py310']
extend-exclude = '''
^(
    tests/
    | verifications/
)
'''

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests", "verifications"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = '^(tests/|verifications/)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term --cov-report=html --cov-fail-under=80"
