[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"

# `living_doc_core` ships no `py.typed`; read its annotations instead of an inline ignore on each import.
[[tool.mypy.overrides]]
module = ["living_doc_core", "living_doc_core.*"]
follow_untyped_imports = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--cov=main --cov=tools --cov-report=term --cov-fail-under=80"
testpaths = ["tests"]
