[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests", "verifications"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pylint.main]
py-version = "3.10"

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term --cov-fail-under=80"
testpaths = ["tests"]
