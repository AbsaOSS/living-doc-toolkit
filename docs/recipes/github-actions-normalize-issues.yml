name: Living Documentation Pipeline

# Trigger on push to main branch or manual workflow dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  normalize-issues:
    name: Normalize Issues to Generator-Ready Format
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python; the action needs Python 3.10 or later on PATH
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Step 3: Run normalize-issues; the action installs the toolkit into a venv of its own
      # Replace <ref> with a release tag or a commit SHA of living-doc-toolkit
      # NOTE: This assumes doc-issues.json exists in the repository
      # In a real pipeline, this would come from the collector action
      - name: Normalize issues
        uses: AbsaOSS/living-doc-toolkit@<ref>
        with:
          command: normalize-issues
          input: doc-issues.json
          output: generator-ready.json
          document-title: Product Requirements
          verbose-logging: 'true'

      # Step 4: Upload artifacts
      - name: Upload generator-ready JSON
        uses: actions/upload-artifact@v4
        with:
          name: generator-ready-json
          path: generator-ready.json
          retention-days: 30

  # ============================================================================
  # CHAINING EXAMPLE: Full Pipeline (Collector → Builder → Generator)
  # ============================================================================
  #
  # In a complete pipeline, you would chain three actions:
  #
  # 1. COLLECTOR: Collect issues from GitHub
  #    - Action: AbsaOSS/living-doc-collector-gh@v1
  #    - Output: doc-issues.json
  #
  # 2. BUILDER (this workflow): Normalize issues
  #    - Action: AbsaOSS/living-doc-toolkit@<ref>, command normalize-issues
  #    - Input: doc-issues.json
  #    - Output: generator-ready.json
  #
  # 3. GENERATOR: Generate PDF document
  #    - Action: AbsaOSS/living-doc-generator-pdf@v1
  #    - Input: generator-ready.json
  #    - Output: living-documentation.pdf
  #
  # Example full pipeline:
