  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: AbsaOSS/living-doc-collector-gh@v1
  #         with:
  #           github-token: ${{ secrets.GITHUB_TOKEN }}
  #           output-file: doc-issues.json
  #       - uses: actions/upload-artifact@v4
  #         with:
  #           name: collector-output
  #           path: doc-issues.json
  #
